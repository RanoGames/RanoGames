    <text x="20" y="90" font-family="Consolas, Menlo, monospace" font-size="14" fill="#3fb950">✓ C++23 · Qt6 · CMake</text>
    <text x="20" y="116" font-family="Consolas, Menlo, monospace" font-size="14" fill="#3fb950">✓ Python · Django · React</text>
    <text x="20" y="142" font-family="Consolas, Menlo, monospace" font-size="14" fill="#58a6ff">✓ fixing bugs...</text>
