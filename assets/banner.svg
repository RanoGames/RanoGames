<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Max — C++23, Qt6, Python, Full-Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#30363d"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)" opacity="0.55"/>

  <!-- волны -->
  <path d="M0,238 C180,198 340,286 600,250 C860,214 1010,282 1200,236 L1200,300 L0,300 Z" fill="url(#wave1)"/>
  <path d="M0,266 C240,236 410,298 660,266 C910,234 1060,296 1200,264 L1200,300 L0,300 Z" fill="#58a6ff" opacity="0.14"/>

  <!-- левый блок -->
  <text x="90" y="98" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="3" fill="#58a6ff">// DEVELOPER PROFILE</text>

  <text x="90" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="700" fill="#ffffff">Max</text>

  <rect x="93" y="181" width="72" height="4" rx="2" fill="url(#accent)"/>

  <text x="90" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="21" letter-spacing="1.5" fill="#8b949e">C++23 · Qt6 · Python · Full-Stack</text>

